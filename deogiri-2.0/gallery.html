<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALLERY-deogiri</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --card: #d6116a;
        --accent: #ffd700;
        --muted: #f0f2f6;
        --glass: rgba(18, 205, 80, 0.7);
        --radius: 12px;
        --max-width: 1200px;
        --shadow: 0 8px 30px rgba(2, 6, 23, 0.06);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial,
          sans-serif;
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(180deg, #1446ac, #5e028c);
        color: #222;
      }

      .container {
        width: calc(100% - 32px);
        max-width: var(--max-width);
        margin: 0 auto;
      }

      /* ================= NAVBAR ================= */
      header.site-header {
        background: var(--card);
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }

      .main-nav {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .main-nav a {
        color: #333;
        font-weight: 600;
        text-decoration: none;
        padding: 6px 10px;
        border-radius: 6px;
      }

      .main-nav a:hover {
        background: rgba(20, 70, 172, 0.1);
        color: var(--primary);
      }

      .cta {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      /* ===== HAMBURGER ===== */
      .hamburger {
        display: none;
        background: none;
        border: none;
        font-size: 26px;
        cursor: pointer;
      }

      /* ===== MOBILE MENU ===== */
      .mobile-menu {
        display: none;
        flex-direction: column;
        background: #fff;
        border-top: 1px solid #eee;
        box-shadow: var(--shadow);
        padding: 10px 0;
      }

      .mobile-menu a {
        padding: 12px 16px;
        color: #333;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid #eee;
      }

      .mobile-menu a:hover {
        background: rgba(20, 70, 172, 0.05);
      }

      .mobile-menu.active {
        display: flex;
        animation: slideDown 0.3s ease forwards;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ====== Gallery Section ====== */
      .gallery-section {
        background: linear-gradient(180deg, #25006b, #a0007e);
        padding: 60px 20px;
        color: white;
        text-align: center;
      }

      .gallery-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 40px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        max-width: 1100px;
        margin: 0 auto;
      }

      .gallery-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
        cursor: pointer;
      }

      .gallery-img:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      /* Lightbox */
      .lightbox {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 999;
      }

      .hidden {
        display: none;
      }

      .lightbox img {
        max-width: 90%;
        max-height: 80%;
        border-radius: 10px;
      }

      .close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 40px;
        color: white;
        cursor: pointer;
      }

      .lightbox-controls {
        position: absolute;
        width: 100%;
        top: 50%;
        display: flex;
        justify-content: space-between;
        padding: 0 30px;
      }

      .prev,
      .next {
        color: white;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
      }
      .prev:hover,
      .next:hover {
        color: #fdd835;
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 768px) {
        .main-nav a,
        .cta {
          display: none;
        }

        .hamburger {
          display: block;
        }

        .hero {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .hero h2 {
          font-size: 26px;
        }
      }

        }
      }

      /* ================= HERO ================= */
      .hero {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 24px;
        align-items: center;
        padding: 40px 0;
        color: #fff;
      }

      .hero h2 {
        font-size: 32px;
        margin: 0 0 10px;
      }

      .hero p {
        color: #eee;
        margin-bottom: 16px;
      }

      .hero button {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }

      /* ================= RESPONSIVE ================= */
      @media (max-width: 768px) {
        .main-nav a,
        .cta {
          display: none;
        }

        .hamburger {
          display: block;
        }

        .hero {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .hero h2 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container topbar">
        <div class="brand">
          <img src="/images/logo.jpg" alt="Deogiri College Logo" />
          <div>
            <h1 style="margin: 0; font-size: 16px">Deogiri College</h1>
            <div style="font-size: 13px; color: #666">
              Since 1960 • NAAC Accredited
            </div>
          </div>
        </div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="department.html">Departments</a>
          <a href="notice.html">Notices</a>
          <a href="gallery.html">Gallery</a>
          <button class="cta"><a href="addmision.html">Admissions</a></button>
          <button class="hamburger" id="hamburger">☰</button>
        </nav>
      </div>

      <div id="mobileMenu" class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="department.html">Departments</a>
        <a href="notice.html">Notices</a>
        <a href="gallery.html">Gallery</a>
        <button class="cta"><a href="addmision.html">Admissions</a></button>
      </div>
    </header>
    <!-- ====== Gallery Section ====== -->
    <section id="gallery" class="gallery-section">
      <h2 class="gallery-title">Campus Gallery</h2>

      <div class="gallery-grid">
        <img
          src="images/programm.jpg"
          alt="College Event 1"
          class="gallery-img"
        />
        <img src="images/camp-2.jpg" alt="Library" class="gallery-img" />
        <img src="images/camp-4.jpg" alt="Campus View" class="gallery-img" />
        <img
          src="images/NCC.jpg"
          alt="Science Department"
          class="gallery-img"
        />
        <img
          src="images/practicle-2.jpg"
          alt="Cultural Fest"
          class="gallery-img"
        />
        <img
          src="images/tree planting.jpg"
          alt="Sports Day"
          class="gallery-img"
        />
      </div>

      <!-- Lightbox / Slider -->
      <div id="lightbox" class="lightbox hidden">
        <span class="close">&times;</span>
        <img class="lightbox-image" src="" alt="" />
        <div class="lightbox-controls">
          <span class="prev">&#10094;</span>
          <span class="next">&#10095;</span>
        </div>
      </div>
    </section>

    <script>
      const hamburger = document.getElementById("hamburger");
      const mobileMenu = document.getElementById("mobileMenu");

      hamburger.addEventListener("click", () => {
        const open = mobileMenu.classList.toggle("active");
        hamburger.textContent = open ? "✕" : "☰";
        hamburger.setAttribute("aria-expanded", open);
      });

      // Auto close menu on link click
      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("active");
          hamburger.textContent = "☰";
          hamburger.setAttribute("aria-expanded", false);
        });
      });

      // Close if resizing back to desktop
      window.addEventListener("resize", () => {
        if (window.innerWidth > 768) {
          mobileMenu.classList.remove("active");
          hamburger.textContent = "☰";
        }
      });
    </script>
  </body>
</html>
